<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Моё хобби</title>
<style>
    body {
        margin: 0;
        min-height: 100hv;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
    }

    .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        padding: 30px;
        max-width: 360px;
        text-align: center;
    }

    .card img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .card h1 {
        color: #2563eb;
        margin: 0 0 15px;
        font-size: 28px;
    }

    .card p {
        color: #444;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .card button {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .card button:hover {
        background: #1d4ed8;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>Программирование</h1>
        <img scr="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500" alt="Программирование">
        <p>Программирование - моё любимое хобби, ведь оно позволяет создавать что-то новое из ничего. Каждый проект - это маленькая головоломка, которую приятно решать. Особенно люблю писать веб-страницы и небольшие игры.</p>
        <button onclick="alert('Это просто демо-кнопка :>')">Подробнее</button>
    </div>
</body>
</html>
